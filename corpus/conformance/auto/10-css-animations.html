<!-- conformance:harness --><style>html,body{margin:0;padding:0}body{font:13px/1.35 system-ui,sans-serif;color:#111;background:transparent}@media (prefers-color-scheme:dark){body{color:#e8e8e8}}[data-stage]{position:relative;overflow:hidden;background:#fff;box-sizing:border-box}.conf-stages{position:relative}.conf-stages>[data-stage]{position:absolute}.conf-head{height:18px;margin:6px 8px 2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#conf-summary{font-weight:400;margin-left:6px}#conf-summary.good{color:#1a7f37}#conf-summary.bad{color:#c62828}#conf-list{margin:2px 8px 8px;white-space:pre-wrap;font:11px/1.35 ui-monospace,monospace;overflow-wrap:anywhere}.conf-probes{margin:0 8px}.v-head{margin:8px 10px 2px;font-weight:600;font-size:15px}.v-hint{margin:0 10px 6px;font-size:12px}.v-row{display:flex;flex-wrap:wrap;align-items:flex-start;margin:6px 10px 10px}.v-row>[data-stage]{margin-right:8px}.v-ref{display:block;background:#fff}.v-cap{width:100%;margin-top:3px;font-size:12px}.v-tag{font-size:10px;font-weight:600;margin-right:4px;padding:0 4px;border-radius:3px;background:#8884}[data-stage="keyframes"]{left:8px;top:8px;width:80px;height:60px}[data-stage="alternate"]{left:96px;top:8px;width:80px;height:60px}[data-stage="steps"]{left:184px;top:8px;width:80px;height:60px}[data-stage="colour"]{left:272px;top:8px;width:80px;height:60px}[data-stage="fill-forwards"]{left:8px;top:76px;width:80px;height:60px}[data-stage="transition"]{left:96px;top:76px;width:80px;height:60px}.conf-stages{height:144px}</style><script>var T = (function () {
  'use strict';
  var root = document.documentElement;
  var ID = root.getAttribute('data-test') || 'unknown';
  var sandbox = typeof TelegramWidget !== 'undefined';
  var mode = window.__conformanceMode || (sandbox ? 'sandbox' : 'native');
  var checks = [];
  var byKey = {};
  var started = false, finished = false, awaiting = false, deadline = 0;
  var queue = [];
  var panelTimer = 0;
  var targets = {}, targetRects = null, stageRects = null;

  function fmt(v) {
    if (typeof v === 'number') return String(Math.round(v * 100) / 100);
    if (typeof v === 'string') return JSON.stringify(v.length > 60 ? v.slice(0, 60) + '…' : v);
    try { return JSON.stringify(v); } catch (e) { return String(v); }
  }

  function record(id, name, ok, detail, opts) {
    opts = opts || {};
    var st;
    if (ok === null) st = 'skip';
    else if (ok === 'pending') st = 'pending';
    else if (opts.xfail) st = ok ? 'xpass' : 'xfail';
    else st = ok ? 'pass' : 'fail';
    var key = id + '|' + name;
    var c = byKey[key];
    if (!c) { c = byKey[key] = { id: id, name: name }; checks.push(c); }
    c.status = st;
    c.detail = detail ? String(detail).slice(0, 160) : '';
    if (opts.xfail && (st === 'xfail' || st === 'xpass')) c.detail = (c.detail ? c.detail + '; ' : '') + 'expected to fail: ' + opts.xfail;
    schedulePublish();
    return st;
  }

  /** Run fn now (or after start); fn returns true/false, [bool, detail], or null to skip. Exceptions fail the check. */
  function check(id, name, fn, opts) {
    opts = opts || {};
    if (opts.sandboxOnly && !sandbox) return record(id, name, null, 'sandbox only', opts);
    if (opts.nativeOnly && sandbox) return record(id, name, null, 'native only', opts);
    var r;
    try { r = typeof fn === 'function' ? fn() : fn; } catch (e) { return record(id, name, false, 'threw ' + (e && e.name ? e.name + ': ' : '') + (e && e.message), opts); }
    if (r === null || r === undefined) return record(id, name, null, 'not applicable', opts);
    if (Array.isArray(r)) return record(id, name, !!r[0], r[1], opts);
    return record(id, name, !!r, '', opts);
  }

  function eq(id, name, actual, expected, opts) {
    return check(id, name, function () { return [actual === expected, 'got ' + fmt(actual) + ', want ' + fmt(expected)]; }, opts);
  }
  function near(id, name, actual, expected, tol, opts) {
    return check(id, name, function () { return [typeof actual === 'number' && Math.abs(actual - expected) <= tol, 'got ' + fmt(actual) + ', want ' + fmt(expected) + ' ±' + tol]; }, opts);
  }

  /** A check resolved later (an event, a timer): pending until pass()/fail() or the deadline. */
  function wait(id, name, opts) {
    opts = opts || {};
    if (opts.sandboxOnly && !sandbox) { record(id, name, null, 'sandbox only', opts); return { pass: function () {}, fail: function () {}, done: true }; }
    record(id, name, 'pending', opts.hint || '', opts);
    var h = {
      done: false,
      pass: function (d) { if (!h.done) { h.done = true; record(id, name, true, d, opts); maybeFinish(); } },
      fail: function (d) { if (!h.done) { h.done = true; record(id, name, false, d, opts); maybeFinish(); } },
      result: function (ok, d) { ok ? h.pass(d) : h.fail(d); },
      skip: function (d) { if (!h.done) { h.done = true; record(id, name, null, d, opts); maybeFinish(); } },
    };
    return h;
  }

  function rect(el) {
    if (typeof el === 'string') el = document.querySelector(el);
    var r = el.getBoundingClientRect();
    return { x: r.left, y: r.top, w: r.width, h: r.height, r: r.right, b: r.bottom };
  }
  function cs(el, prop, pseudo) {
    if (typeof el === 'string') el = document.querySelector(el);
    return getComputedStyle(el, pseudo || null).getPropertyValue(prop).trim();
  }
  /** Normalised computed colour "r,g,b,a" (a 0–1, two decimals) from rgb()/rgba(). */
  function color(el, prop, pseudo) {
    var v = cs(el, prop || 'background-color', pseudo);
    var m = /rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:\s*[,/]\s*([\d.]+%?))?\s*\)/.exec(v);
    if (!m) return v;
    var a = m[4] === undefined ? 1 : m[4].slice(-1) === '%' ? parseFloat(m[4]) / 100 : parseFloat(m[4]);
    return Math.round(+m[1]) + ',' + Math.round(+m[2]) + ',' + Math.round(+m[3]) + ',' + Math.round(a * 100) / 100;
  }

  function counts() {
    var n = { pass: 0, fail: 0, xfail: 0, xpass: 0, skip: 0, pending: 0 };
    for (var i = 0; i < checks.length; i++) n[checks[i].status]++;
    return n;
  }

  function status() {
    if (finished) return 'done';
    if (!started) return 'running';
    var n = counts();
    if (queue.length) return 'running';
    if (n.pending === 0) return 'done';
    return awaiting ? 'awaiting' : 'running';
  }

  function publish() {
    panelTimer = 0;
    var st = status();
    if (st === 'done') finished = true;
    var n = counts();
    var out = { v: 1, id: ID, mode: mode, status: st, n: n, checks: checks.map(function (c) { return [c.id, c.name, c.status, c.detail]; }) };
    // Interactive widgets: targets are re-measured on every publish, so a runner taps where things are now.
    if (targetRects && st !== 'done') { try { measureTargets(); } catch (e) {} }
    if (targetRects) out.targets = targetRects;
    if (stageRects) out.stages = stageRects;
    root.setAttribute('data-conformance', JSON.stringify(out));
    var p = document.getElementById('conf-summary');
    if (p) {
      p.textContent = (st === 'done' ? '' : st + ' · ') + 'pass ' + n.pass + ' · fail ' + n.fail + (n.xfail ? ' · xfail ' + n.xfail : '') + (n.xpass ? ' · XPASS ' + n.xpass : '') + (n.skip ? ' · skip ' + n.skip : '') + (n.pending ? ' · pending ' + n.pending : '');
      p.className = n.fail || n.xpass ? 'bad' : n.pending ? '' : 'good';
    }
    var list = document.getElementById('conf-list');
    if (list) {
      var lines = [];
      for (var i = 0; i < checks.length; i++) {
        var c = checks[i];
        if (list.hasAttribute('data-all') || c.status === 'fail' || c.status === 'xpass' || c.status === 'pending')
          lines.push({ 'pass': '✓ ', 'fail': '✗ ', 'xfail': '· ', 'xpass': '! ', 'skip': '– ', 'pending': '… ' }[c.status] + c.id + ' — ' + c.name + (c.detail && c.status !== 'pass' ? ' (' + c.detail + ')' : ''));
      }
      list.textContent = lines.join('\n');
    }
    if (st === 'done' && typeof console !== 'undefined') console.log('[conformance] ' + ID + ' ' + JSON.stringify(n));
  }
  function schedulePublish() { if (!panelTimer) panelTimer = setTimeout(publish, 0); }

  function maybeFinish() {
    if (!started || queue.length) return;
    var n = counts();
    if (n.pending === 0) { finished = true; publish(); }
    else schedulePublish();
  }

  /** Mark the remaining pending checks failed (no event arrived) and finish. */
  function timeout() {
    for (var i = 0; i < checks.length; i++) if (checks[i].status === 'pending') { checks[i].status = 'fail'; checks[i].detail = (checks[i].detail ? checks[i].detail + '; ' : '') + 'timed out'; }
    finished = true;
    publish();
  }

  /** Steps run in order after the first frames; a step may return a delay in ms before the next one. */
  function step(fn) { queue.push(fn); }
  function r4(el) { var r = el.getBoundingClientRect(); return [Math.round(r.left * 10) / 10, Math.round(r.top * 10) / 10, Math.round(r.width * 10) / 10, Math.round(r.height * 10) / 10]; }
  function measureTargets() {
    targetRects = {};
    for (var k in targets) { var el = typeof targets[k] === 'string' ? document.querySelector(targets[k]) : targets[k]; if (el) targetRects[k] = r4(el); }
  }
  function measure() {
    measureTargets();
    stageRects = {};
    var st = document.querySelectorAll('[data-stage]');
    for (var i = 0; i < st.length; i++) stageRects[st[i].getAttribute('data-stage')] = r4(st[i]);
  }
  function next() {
    if (!started && targetRects === null) { try { measure(); } catch (e) { record('harness', 'measure threw', false, e && e.message); } }
    if (!queue.length) { started = true; if (deadline) setTimeout(timeout, deadline); maybeFinish(); return; }
    var fn = queue.shift();
    var delay = 0;
    try { delay = fn() || 0; } catch (e) { record('harness', 'step threw', false, e && e.message); }
    setTimeout(next, delay);
  }

  /**
   * Start after the renderer had a chance to lay out (two frames, a fallback
   * timer when frames do not come). `awaitInput: ms` keeps the widget in
   * `awaiting` until its pending checks resolve or the time is up.
   */
  function run(opts) {
    opts = opts || {};
    if (opts.awaitInput) { awaiting = true; deadline = opts.awaitInput; }
    else if (opts.deadline) deadline = opts.deadline;
    publish();
    var went = false;
    var go = function () { if (!went) { went = true; setTimeout(next, opts.settle || 60); } };
    try { requestAnimationFrame(function () { requestAnimationFrame(go); }); } catch (e) {}
    setTimeout(go, 400);
  }

  // Reference mode (native rendering for the expected images): a stage with a
  // <template data-ref="name"> gets the template's markup instead of its own.
  function swapRefs() {
    var ts = document.querySelectorAll('template[data-ref]');
    for (var i = 0; i < ts.length; i++) {
      var name = ts[i].getAttribute('data-ref');
      var st = document.querySelector('[data-stage="' + name + '"]');
      if (st) { st.innerHTML = ts[i].innerHTML; st.setAttribute('data-ref-applied', ''); }
    }
  }
  /** Draw into a stage from script; skipped in reference mode when the stage has a template. */
  function stage(name, draw) {
    var el = document.querySelector('[data-stage="' + name + '"]');
    if (!el) return;
    if (mode === 'ref' && document.querySelector('template[data-ref="' + name + '"]')) return;
    try { draw(el); } catch (e) { record('harness', 'stage ' + name + ' threw', false, e && e.message); }
  }
  if (mode === 'ref') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', swapRefs); else swapRefs();
  }

  return {
    id: ID, sandbox: sandbox, mode: mode, check: check, eq: eq, near: near, wait: wait, ok: function (id, name, cond, detail, opts) { return check(id, name, function () { return [cond, detail]; }, opts); },
    rect: rect, cs: cs, color: color, step: step, run: run, stage: stage, publish: publish,
    /** A named element the runner may tap or drag (its rect is published as targets[name] when the run starts). */
    target: function (name, el) { targets[name] = el; },
    remeasure: function () { measure(); schedulePublish(); },
    skip: function (id, name, why) { return record(id, name, null, why); },
  };
})();</script><!-- /conformance:harness -->
<style>
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
@keyframes grow{from{width:10px}to{width:70px}}
@keyframes tint{from{background:#c33}to{background:#36c}}
@keyframes short{from{opacity:1}to{opacity:.5}}
.conf-probes{font:13px/16px sans-serif}
.box{position:absolute;left:10px;width:20px;height:20px;background:#c33}
.s-kf{top:20px;animation:slide 10s linear -5s paused}
.s-alt{top:20px;background:#36c;animation:slide 10s linear -13s 2 alternate paused}
.s-steps{top:20px;height:20px;background:#3a3;animation:grow 8s steps(4,end) -3s paused}
.s-tint{left:20px;top:15px;width:40px;height:30px;animation:tint 10s linear -5s paused}
.s-fill{top:20px;background:#e83;animation:slide .1s linear forwards}
.s-tr{top:20px;background:#a3a;transition:transform 10000s linear -5000s}
.s-tr.go{transform:translateX(60px)}
#p-kf{animation:slide 10s linear -2.5s paused}
#p-steps{animation:grow 8s steps(4,end) -3s paused;height:4px;background:#3a3}
#p-ease{animation:grow 10s ease-in -5s paused;height:4px;background:#36c}
#p-tr{transition:width 10000s linear -2500s;width:10px;height:4px;background:#a3a}
#p-tr.go{width:110px}
#ev-anim{animation:short .2s linear 1}
#ev-iter{animation:short .1s linear 3}
#ev-tr{transition:opacity .15s linear;opacity:1;width:4px;height:4px}
#ev-tr.go{opacity:.4}
</style>

<body>
<div class="conf-stages">
  <div data-stage="keyframes" data-covers="at.keyframes anim.keyframes anim.play-state"><div class="box s-kf"></div></div>
  <div data-stage="alternate" data-covers="anim.keyframes"><div class="box s-alt"></div></div>
  <div data-stage="steps" data-covers="anim.easing"><div class="box s-steps"></div></div>
  <div data-stage="colour" data-covers="anim.keyframes"><div class="box s-tint"></div></div>
  <div data-stage="fill-forwards" data-covers="anim.keyframes"><div class="box s-fill"></div></div>
  <div data-stage="transition" data-covers="anim.transition"><div class="box s-tr" id="s-tr"></div></div>
</div>
<div class="conf-head">10 · CSS animations and transitions <span id="conf-summary"></span></div>
<div class="conf-probes">
  <div style="position:relative;height:30px"><div class="box" id="p-kf" style="left:0;top:0"></div></div>
  <div id="p-steps"></div><div id="p-ease"></div><div id="p-tr"></div>
  <div id="ev-anim" style="width:4px;height:4px;background:#c33"></div><div id="ev-iter" style="width:4px;height:4px;background:#c33"></div><div id="ev-tr" style="background:#c33"></div>
</div>
<div id="conf-list"></div>
<script>
var R = T.rect;
var tx = function (sel) { var m = /matrix\(([^)]*)\)/.exec(T.cs(sel, 'transform')); return m ? parseFloat(m[1].split(',')[4]) : T.cs(sel, 'transform'); };
var evStart = T.wait('anim.events', 'animationstart fires');
var evEnd = T.wait('anim.events', 'animationend fires');
var evName = T.wait('anim.events', 'animation events carry animationName and elapsedTime');
var evIter = T.wait('anim.events', 'animationiteration fires twice');
var evTr = T.wait('anim.events', 'transitionend fires');
var evProp = T.wait('anim.events', 'transitionend carries propertyName');
var iters = 0;
var a = document.getElementById('ev-anim');
a.addEventListener('animationstart', function (e) { evStart.pass(); });
a.addEventListener('animationend', function (e) { evEnd.pass(); evName.result(e.animationName === 'short' && Math.abs(e.elapsedTime - 0.2) < 0.01, JSON.stringify(e.animationName) + ' at ' + e.elapsedTime); });
document.getElementById('ev-iter').addEventListener('animationiteration', function () { if (++iters === 2) evIter.pass('2 iterations'); });
document.getElementById('ev-tr').addEventListener('transitionend', function (e) { evTr.pass(); evProp.result(e.propertyName === 'opacity', JSON.stringify(e.propertyName)); });

T.step(function () {
  // Transitions start from a rendered state: change the classes after the first frames.
  document.getElementById('s-tr').classList.add('go');
  document.getElementById('p-tr').classList.add('go');
  document.getElementById('ev-tr').classList.add('go');
  return 120;
});
T.step(function () {
  T.near('anim.keyframes', 'a paused animation at -2.5s of 10s is at 25%', tx('#p-kf'), 10, 0.5);
  T.near('anim.play-state', 'paused stays put', tx('#p-kf'), 10, 0.5);
  T.near('anim.easing', 'steps(4, end) at 37.5% is the first step', R('#p-steps').w, 25, 0.5);
  T.ok('anim.easing', 'ease-in at 50% lags behind linear', R('#p-ease').w > 10 && R('#p-ease').w < 36, R('#p-ease').w + '');
  T.near('anim.transition', 'a transition with a negative delay starts part-way', R('#p-tr').w, 35, 1);
});
T.run({ deadline: 3000 });
</script>
<template data-ref="keyframes"><div style="position:absolute;left:30px;top:20px;width:20px;height:20px;background:#c33"></div></template>
<template data-ref="alternate"><div style="position:absolute;left:38px;top:20px;width:20px;height:20px;background:#36c"></div></template>
<template data-ref="steps"><div style="position:absolute;left:10px;top:20px;width:25px;height:20px;background:#3a3"></div></template>
<template data-ref="fill-forwards"><div style="position:absolute;left:50px;top:20px;width:20px;height:20px;background:#e83"></div></template>
<template data-ref="transition"><div style="position:absolute;left:40px;top:20px;width:20px;height:20px;background:#a3a"></div></template>
