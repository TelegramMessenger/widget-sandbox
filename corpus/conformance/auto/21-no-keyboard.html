<body>
<div class="conf-head">21 · No keyboard <span id="conf-summary"></span></div>
<div class="conf-probes">
  <button id="btn">button</button><a id="lnk" href="#t">link</a><button id="finish">Finish</button>
</div>
<div id="conf-list"></div>
<script>
['btn', 'lnk', 'finish'].forEach(function (n) { T.target(n, '#' + n); });
var X = { xfail: 'key events are still delivered (D4 not enforced yet)' };
var keyEv = T.wait('input.keyboard', 'no keydown, keyup, keypress, beforeinput or input event reaches the widget', X);

document.getElementById('btn').addEventListener('click', function () { clicks.btn++; });
document.getElementById('lnk').addEventListener('click', function (e) { clicks.lnk++; e.preventDefault(); });
document.getElementById('finish').addEventListener('click', function () {
  var total = seen.keydown + seen.keyup + seen.keypress + seen.beforeinput + seen.input;
  keyEv.result(total === 0, JSON.stringify(seen));
  keyAct.result(clicks.btn === 1 && clicks.lnk === 1, 'button ' + clicks.btn + ', link ' + clicks.lnk + ' clicks');
});

  var btn = document.getElementById('btn');
  btn.focus();
  T.ok('js.focus', 'focus() does not make :focus match in the renderer', T.color('#btn', 'outline-color') !== '9,9,9,1', T.color('#btn', 'outline-color'), { xfail: 'focus() still reaches the shim and the renderer' });

</script>
