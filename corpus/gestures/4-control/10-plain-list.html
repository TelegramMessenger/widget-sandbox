<!--
  gestures: no touch-action (auto), the control: the widget claims nothing (corpus/gestures/README.md)
  idea: the control for this set, a plain checklist on touch-action: auto. Tap a row to tick it off, double-tap one to star it: taps and double taps are always the widget's. Every drag is the chat's (up or down scrolls it, sideways is swipe-to-reply) and a hold opens the message menu, the way a text message behaves.
-->
<title>Packing list</title>
<style>
  .ta { margin: 0 0 6px; font-size: 13px; color: var(--tg-theme-hint-color) }
  h3 { margin: 0 0 4px }
  #ls { margin: 0; padding: 0; list-style: none }
  #ls li { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--tg-theme-section-separator-color) }
  #ls li:last-child { border-bottom: 0 }
  .bx { width: 20px; height: 20px; flex: none; box-sizing: border-box; border-radius: 6px; border: 2px solid var(--tg-theme-hint-color); text-align: center; font-size: 13px; line-height: 16px; color: var(--tg-theme-button-text-color) }
  li.on .bx { border-color: var(--tg-theme-button-color); background: var(--tg-theme-button-color) }
  li.on .t { color: var(--tg-theme-hint-color); text-decoration: line-through }
  .t { flex: 1 }
  .st { margin: 6px 0 0; font-size: 13px }
</style>
<p class="ta"><code>touch-action: auto</code> · tap to tick, double-tap to star; every drag and hold is the chat's</p>
<h3>Packing for the weekend</h3>
<ul id="ls"></ul>
<p class="st"><span id="n"></span> · presses taken by the chat: <b id="tk">0</b></p>
<script>
var $ = function (id) { return document.getElementById(id); };
var things = ['Passport', 'Charger and cable', 'Rain jacket', 'Walking shoes', 'Sunglasses', 'Toothbrush', 'Headphones', 'Snacks for the train'];
var state = {}, took = 0;
try { state = JSON.parse(localStorage.getItem('packing') || '{}') || {}; } catch (_) {}
function save() { try { localStorage.setItem('packing', JSON.stringify(state)); } catch (_) {} }
function count() {
  var n = things.filter(function (t, i) { return state[i] & 1; }).length;
  $('n').textContent = n + ' of ' + things.length + ' packed';
}
things.forEach(function (t, i) {
  var li = document.createElement('li'), bx = document.createElement('span'), tx = document.createElement('span'), star = document.createElement('span');
  bx.className = 'bx';
  tx.className = 't';
  tx.textContent = t;
  li.append(bx, tx, star);
  // bit 1: packed, bit 2: starred
  function draw() {
    li.className = state[i] & 1 ? 'on' : '';
    bx.textContent = state[i] & 1 ? '✓' : '';
    star.textContent = state[i] & 2 ? '⭐' : '';
  }
  li.addEventListener('click', function () { state[i] = (state[i] || 0) ^ 1; save(); draw(); count(); });
  // a double tap's two clicks tick and untick again; then the star
  li.addEventListener('dblclick', function () { state[i] = (state[i] || 0) ^ 2; save(); draw(); });
  draw();
  $('ls').appendChild(li);
});
// any press the chat takes, over a row or the text around the list
document.addEventListener('pointercancel', function () { $('tk').textContent = ++took; });
count();
</script>
