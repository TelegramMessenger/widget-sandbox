<!--
  gestures: touch-action: none on the board, so swipes in all four directions are the widget's (corpus/gestures/README.md); 06-2048-x is the same game on pan-y
  idea: 2048 on touch-action: none. Swipe up, down, left or right to slide the tiles; two equal tiles merge into their sum. Reach 2048. Score, best and the game itself are kept. Compare with 06, the same game on pan-y, where an up or down swipe scrolls the chat.
-->
<title>2048</title>
<style>
  .ta { margin: 0 0 8px; font-size: 13px; color: var(--tg-theme-hint-color) }
  .hd { display: flex; justify-content: space-between; align-items: center; margin: 0 8px 8px; font-variant-numeric: tabular-nums }
  #bd { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; box-sizing: border-box; width: calc(100% - 16px); max-width: 300px; aspect-ratio: 1; margin: 0 auto; padding: 6px; border-radius: 10px; background: #bbada0; touch-action: none }
  #bd div { display: flex; align-items: center; justify-content: center; border-radius: 6px; background: rgba(238, 228, 218, .35); color: #776e65; font: 700 26px/1 system-ui, sans-serif }
  #bd .n { animation: pop .15s ease-out }
  @keyframes pop { from { opacity: .2 } }
  .st { margin: 8px 0 0; font-size: 13px }
</style>
<p class="ta"><code>touch-action: none</code> · the xy game: swipe up, down, left or right to merge the tiles</p>
<div class="hd"><span>Score <b id="sc">0</b> · best <b id="bs">0</b></span><button id="ng">New game</button></div>
<div id="bd"></div>
<p class="st"><span id="msg">Join equal tiles</span> · presses taken by the chat: <b id="tk">0</b></p>
<script>
var $ = function (id) { return document.getElementById(id); };
var COLORS = { 2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e' };
var bd = $('bd'), cells = [], g, score, seed = 48, fresh = -1, took = 0, press = null;
var best = Number(localStorage.getItem('best')) || 0;
for (var i = 0; i < 16; i++) cells.push(bd.appendChild(document.createElement('div')));
function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }
function add() {
  var empty = [];
  g.forEach(function (v, k) { if (!v) empty.push(k); });
  fresh = empty[Math.floor(rnd() * empty.length)];
  g[fresh] = rnd() < 0.9 ? 2 : 4;
}
function newGame() { g = []; for (var k = 0; k < 16; k++) g.push(0); score = 0; add(); add(); }
function save() { try { localStorage.setItem('game', JSON.stringify({ g: g, score: score, seed: seed })); localStorage.setItem('best', String(best)); } catch (_) {} }
function canMove() {
  for (var k = 0; k < 16; k++) {
    if (!g[k] || (k % 4 < 3 && g[k] === g[k + 1]) || (k < 12 && g[k] === g[k + 4])) return true;
  }
  return false;
}
function draw() {
  cells.forEach(function (c, k) {
    var v = g[k];
    c.textContent = v || '';
    c.className = k === fresh ? 'n' : '';
    c.style.background = v ? COLORS[v] || '#3c3a32' : '';
    c.style.color = v > 4 ? '#f9f6f2' : '';
    c.style.fontSize = v >= 1024 ? '17px' : v >= 128 ? '21px' : '';
  });
  $('sc').textContent = score;
  $('bs').textContent = best;
  $('msg').textContent = g.indexOf(2048) >= 0 ? '🎉 2048!' : canMove() ? 'Join equal tiles' : 'No moves left';
}
// dir: 0 left, 1 right, 2 up, 3 down; each line is read from the side the tiles slide to
function move(dir) {
  var moved = false;
  for (var i = 0; i < 4; i++) {
    var idx = [0, 1, 2, 3].map(function (j) {
      var a = dir % 2 ? 3 - j : j;
      return dir < 2 ? i * 4 + a : a * 4 + i;
    });
    var vals = idx.map(function (k) { return g[k]; }).filter(Boolean), out = [];
    for (var j = 0; j < vals.length; j++) {
      if (vals[j] === vals[j + 1]) { out.push(vals[j] * 2); score += vals[j] * 2; j++; }
      else out.push(vals[j]);
    }
    idx.forEach(function (k, j) {
      var v = out[j] || 0;
      if (g[k] !== v) moved = true;
      g[k] = v;
    });
  }
  if (!moved) return;
  add();
  if (score > best) best = score;
  save();
  draw();
}
try { var s = JSON.parse(localStorage.getItem('game')); g = s.g; score = s.score; seed = s.seed; } catch (_) {}
if (!g || g.length !== 16) newGame();
draw();
$('ng').addEventListener('click', function () { newGame(); save(); draw(); });
bd.addEventListener('pointerdown', function (e) {
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, done: false };
  try { bd.setPointerCapture(e.pointerId); } catch (_) {}
});
// one move per swipe, as soon as the finger has gone 24 px
bd.addEventListener('pointermove', function (e) {
  if (!press || press.done || e.pointerId !== press.id) return;
  var dx = e.clientX - press.x, dy = e.clientY - press.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  press.done = true;
  move(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 0 : 1) : (dy < 0 ? 2 : 3));
});
bd.addEventListener('pointerup', function () { press = null; });
bd.addEventListener('pointercancel', function () {
  if (!press) return;
  press = null;
  $('tk').textContent = ++took;
});
</script>
