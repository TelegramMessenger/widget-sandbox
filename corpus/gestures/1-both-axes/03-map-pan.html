<!--
  gestures: touch-action: none on the map, so it pans on both axes and double taps zoom (corpus/gestures/README.md)
  idea: a city map you pan with your finger, on touch-action: none. Drag in any direction, diagonals and up or down first included; double-tap to zoom in and out; tap a pin for its place. Under the map the chat never scrolls; scroll the chat from the text or the bubble around it.
-->
<title>City walk</title>
<style>
  .ta { margin: 0 0 8px; font-size: 13px; color: var(--tg-theme-hint-color) }
  #vp { position: relative; height: 240px; margin: 0 8px; border-radius: 12px; overflow: hidden; background: #e9e4d8; touch-action: none }
  #m { position: absolute; left: 0; top: 0; width: 600px; height: 440px; transform-origin: 0 0 }
  #m.z { transition: transform .25s }
  svg { display: block }
  .w { fill: #9fcfee }
  .p { fill: #b9dca4 }
  .b { fill: #d9d2c3 }
  .s { stroke: #fff; fill: none }
  .pin { fill: #e53935; stroke: #fff; stroke-width: 2 }
  .lb { font: 600 12px system-ui, sans-serif; fill: #333 }
  .st { margin: 8px 0 0; font-size: 13px }
</style>
<p class="ta"><code>touch-action: none</code> · drag the map any way, double-tap to zoom, tap a pin</p>
<div id="vp"><div id="m"><svg width="600" height="440" viewBox="0 0 600 440">
  <rect class="b" x="0" y="0" width="600" height="440"/>
  <path class="s" stroke-width="5" d="M0 60H600M0 130H600M0 200H600M0 270H600M0 340H600M0 410H600M60 0V440M150 0V440M240 0V440M330 0V440M420 0V440M510 0V440"/>
  <path class="s" stroke-width="11" d="M0 200H600M330 0V440M0 440L600 0"/>
  <rect class="p" x="160" y="70" width="150" height="110" rx="10"/>
  <path class="w" d="M0 300C90 260 160 330 250 310S400 220 470 260S560 330 600 300V350C560 380 500 310 460 310S350 380 260 360S100 300 0 350Z"/>
  <g>
    <circle class="pin" cx="235" cy="125" r="9" id="p0"/>
    <circle class="pin" cx="375" cy="165" r="9" id="p1"/>
    <circle class="pin" cx="95" cy="235" r="9" id="p2"/>
    <circle class="pin" cx="470" cy="385" r="9" id="p3"/>
  </g>
  <text class="lb" x="200" y="160">Park</text>
  <text class="lb" x="520" y="290">River</text>
  <text class="lb" x="340" y="190">Main sq.</text>
</svg></div></div>
<p class="st"><span id="pl">Tap a pin</span> · presses taken by the chat: <b id="tk">0</b></p>
<script>
var $ = function (id) { return document.getElementById(id); };
var vp = $('vp'), m = $('m');
var view = { x: -150, y: -100, z: 1 }, vw = 280, vh = 240, press = null, took = 0, pin = '';
var places = ['Rose garden · 4 min', 'Café Ruby · 7 min', 'Old bridge · 12 min', 'Night market · 15 min'];
function clamp() {
  view.x = Math.min(0, Math.max(vw - 600 * view.z, view.x));
  view.y = Math.min(0, Math.max(vh - 440 * view.z, view.y));
}
function draw() { m.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.z + ')'; }
draw();
vp.addEventListener('pointerdown', function (e) {
  vw = vp.clientWidth || vw;
  vh = vp.clientHeight || vh;
  press = { id: e.pointerId, sx: e.clientX, sy: e.clientY, x: view.x, y: view.y };
  // the pointer is captured, so the tap's click goes to the map: remember the pin pressed
  pin = /^p\d$/.test(e.target.id || '') ? places[e.target.id.slice(1)] : '';
  m.className = '';
  try { vp.setPointerCapture(e.pointerId); } catch (_) {}
});
vp.addEventListener('pointermove', function (e) {
  if (!press || e.pointerId !== press.id) return;
  view.x = press.x + e.clientX - press.sx;
  view.y = press.y + e.clientY - press.sy;
  if (Math.abs(e.clientX - press.sx) + Math.abs(e.clientY - press.sy) > 6) pin = ''; // a mouse drag still ends with a click
  clamp();
  draw();
});
vp.addEventListener('pointerup', function () { press = null; });
vp.addEventListener('pointercancel', function () {
  if (!press) return;
  press = null;
  $('tk').textContent = ++took;
});
vp.addEventListener('dblclick', function (e) {
  // zoom around the tap: the map point under the finger stays under it
  var r = vp.getBoundingClientRect(), fx = e.clientX - r.left, fy = e.clientY - r.top, z = view.z === 1 ? 2 : 1;
  view.x = fx - (fx - view.x) * z / view.z;
  view.y = fy - (fy - view.y) * z / view.z;
  view.z = z;
  clamp();
  m.className = 'z';
  draw();
});
vp.addEventListener('click', function () { if (pin) $('pl').textContent = '📍 ' + pin; });
</script>
