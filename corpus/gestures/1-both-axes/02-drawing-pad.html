<!--
  gestures: touch-action: none on the canvas, so every stroke is the widget's (corpus/gestures/README.md)
  idea: a drawing pad on a canvas with touch-action: none. Draw in any direction, start with an up or down stroke, dot with a long press: the chat never scrolls or opens the menu over the paper; the colour buttons and Clear are ordinary taps.
-->
<title>Drawing pad</title>
<style>
  .ta { margin: 0 0 8px; font-size: 13px; color: var(--tg-theme-hint-color) }
  #cv { display: block; width: calc(100% - 16px); height: 220px; margin: 0 8px; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .35); touch-action: none }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 8px 0 }
  .c { width: 30px; height: 30px; padding: 0; border-radius: 50% }
  .c.on { box-shadow: 0 0 0 2px var(--tg-theme-bg-color), 0 0 0 4px var(--tg-theme-button-color) }
  #clr { margin-left: auto }
  .st { margin: 8px 0 0; font-size: 13px }
</style>
<p class="ta"><code>touch-action: none</code> · draw any way, start up or down, hold for a dot: the chat never takes the paper</p>
<canvas id="cv" width="560" height="440"></canvas>
<div class="row" id="row"><button id="clr">Clear</button></div>
<p class="st"><b id="n">0</b> strokes · presses taken by the chat: <b id="tk">0</b></p>
<script>
var $ = function (id) { return document.getElementById(id); };
var cv = $('cv'), ctx = cv.getContext('2d'), row = $('row');
var inks = ['#222222', '#e53935', '#1e88e5', '#43a047', '#fb8c00'], ink = inks[0], swatches = [];
var press = null, strokes = 0, took = 0;
// a buffer of two device pixels per CSS pixel at the width the bubble gives the pad
var r0 = cv.getBoundingClientRect();
if (r0.width > 0) { cv.width = Math.round(r0.width * 2); cv.height = Math.round(r0.height * 2); }
inks.forEach(function (c, i) {
  var b = document.createElement('button');
  b.className = 'c' + (i ? '' : ' on');
  b.style.background = c;
  b.setAttribute('aria-label', 'ink ' + c);
  b.addEventListener('click', function () {
    ink = c;
    swatches.forEach(function (s) { s.className = 'c' + (s === b ? ' on' : ''); });
  });
  swatches.push(b);
  row.insertBefore(b, $('clr'));
});
$('clr').addEventListener('click', function () {
  ctx.clearRect(0, 0, cv.width, cv.height);
  $('n').textContent = strokes = 0;
});
function at(e) { return { x: (e.clientX - press.r.left) * cv.width / press.r.width, y: (e.clientY - press.r.top) * cv.height / press.r.height }; }
cv.addEventListener('pointerdown', function (e) {
  var r = cv.getBoundingClientRect();
  press = { id: e.pointerId, r: r.width > 0 ? r : { left: 0, top: 0, width: cv.width / 2, height: cv.height / 2 } };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  press.p = at(e);
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.lineWidth = 6;
  ctx.strokeStyle = ctx.fillStyle = ink;
  ctx.beginPath();
  ctx.arc(press.p.x, press.p.y, 3, 0, 7);
  ctx.fill();
});
cv.addEventListener('pointermove', function (e) {
  if (!press || e.pointerId !== press.id) return;
  var p = at(e);
  ctx.beginPath();
  ctx.moveTo(press.p.x, press.p.y);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  press.p = p;
});
cv.addEventListener('pointerup', function (e) {
  if (!press || e.pointerId !== press.id) return;
  press = null;
  $('n').textContent = ++strokes;
});
cv.addEventListener('pointercancel', function () {
  if (!press) return;
  press = null;
  $('tk').textContent = ++took;
});
</script>
