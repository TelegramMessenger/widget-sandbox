[workspace]
resolver = "3"
members = ["crates/bundle_stamp", "crates/cpu_budget", "crates/engine", "crates/engine_ffi", "crates/gesture", "crates/host", "crates/js", "crates/json", "crates/sdk_policy", "crates/server", "crates/stream", "crates/testkit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
float_cmp = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
field_reassign_with_default = "allow"
# `!(v > 0.0)` is the C++'s test that a NaN fails too.
neg_cmp_op_on_partial_ord = "allow"

[profile.release]
codegen-units = 1
panic = "unwind"

# nova-safe's own copies of crates.io crates with their `unsafe` removed: cargo applies a workspace's patches only
# from the root, so the engine's are repeated here (nova-safe's Cargo.toml).
[patch.crates-io]
bitflags = { path = "../../../nova-safe/oxc/vendor/bitflags" }
cow-utils = { path = "../../../nova-safe/oxc/vendor/cow-utils" }
num-traits = { path = "../../../nova-safe/num-traits" }
unicode-id-start = { path = "../../../nova-safe/oxc/vendor/unicode-id-start" }

# The engine is always optimized, as the C++ links a release Nova: a debug one recurses far less deep in its stack.
[profile.dev.package."*"]
opt-level = 2
