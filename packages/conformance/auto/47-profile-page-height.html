<style>
#hero{box-sizing:border-box;min-height:var(--tg-viewport-height,200px);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:linear-gradient(#46c,#9be)}

<body>
<div id="hero"><div class="conf-head">47 · Profile: page height</div><div id="conf-list"></div></div>
<div id="tail"></div>
<script>
// A profile page (docs/sdk-v1.md §2.19): at least the viewport tall, at most the page ceiling; no resize anchor.
var TW = typeof TelegramWidget !== 'undefined' ? TelegramWidget : null;
var S = T.sandbox ? {} : { sandboxOnly: true };
var vh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tg-viewport-height'));

T.step(function () {
  T.eq('tw.surface', "surface is 'profile'", TW && TW.surface, 'profile', S);
  T.ok('tw.surface', '--tg-viewport-height is a length in px over 0 and at most the page ceiling (4000)', vh > 0 && vh <= 4000 && /px$/.test(getComputedStyle(document.documentElement).getPropertyValue('--tg-viewport-height').trim()), String(vh), S);
  // Natively the variable is not set and the fallback applies.
  T.near('tw.surface', 'a hero with min-height: var(--tg-viewport-height) is the viewport tall', T.rect('#hero').h, vh > 0 ? vh : 200, 0.5);
  T.ok('behaviour.profile-page', 'the document is taller than the viewport (it scrolls with the profile)', T.rect('#tail').b > T.rect('#hero').h, T.rect('#tail').b + ' > ' + T.rect('#hero').h);
  T.ok('tw.resize-anchor', "setResizeAnchor('bottom') is accepted and does nothing on a page", function () { try { TW.setResizeAnchor('bottom'); return true; } catch (e) { return [false, String(e)]; } }, '', S);
  T.ok('tw.resize-anchor', 'setResizeAnchor still checks its argument', function () { try { TW.setResizeAnchor('middle'); return [false, 'no TypeError']; } catch (e) { return [e instanceof TypeError, String(e)]; } }, '', S);
});
T.run();
</script>
</body>
