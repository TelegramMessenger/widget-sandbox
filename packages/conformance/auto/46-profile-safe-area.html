<style>
.p{position:relative;height:6px;margin:0 0 2px;background:#eef}
.p>div{height:6px;background:#46c}
#e1{width:env(safe-area-inset-top)}
#e2{width:env(safe-area-inset-bottom,77px)}
#e3{width:env(safe-area-inset-left,5px)}
#e4{width:calc(10px + env(safe-area-inset-top, 0))}
#e5{width:max(4px, env(safe-area-inset-right))}
#e6{width:var(--tg-safe-area-inset-top)}
#e7{width:var(--tg-safe-area-inset-bottom)}
#e8{width:var(--tg-content-safe-area-inset-top)}

<body>
<div class="conf-head">46 · Profile: safe-area layers</div>
<div class="conf-probes">
  <div class="p"><div id="e1"></div></div><div class="p"><div id="e2"></div></div><div class="p"><div id="e3"></div></div><div class="p"><div id="e4"></div></div>
  <div class="p"><div id="e5"></div></div><div class="p"><div id="e6"></div></div><div class="p"><div id="e7"></div></div><div class="p"><div id="e8"></div></div>
</div>
<div id="conf-list"></div>
<script>
// A profile page (docs/sdk-v1.md §2.17, §2.19): the device's edges, the client's chrome inside them, the sum in env().
var TW = typeof TelegramWidget !== 'undefined' ? TelegramWidget : null;
var S = T.sandbox ? {} : { sandboxOnly: true };
// What the host passed (natively: nothing over the page, all 0).
var D = TW && TW.safeAreaInset || { top: 0, right: 0, bottom: 0, left: 0 };
var C = TW && TW.contentSafeAreaInset || { top: 0, right: 0, bottom: 0, left: 0, cornerLeft: 0, cornerRight: 0 };
var W = function (s) { return T.rect(s).w; };
var v = function (n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); };
var SIDES = ['top', 'right', 'bottom', 'left'];
var sum = function (k) { return D[k] + C[k]; };

T.step(function () {
  T.eq('tw.surface', "surface is 'profile'", TW && TW.surface, 'profile', S);
  var d = TW && TW.safeAreaInset;
  T.ok('tw.safe-area', 'safeAreaInset: a frozen object of four numbers, the same object on every read', !!d && Object.isFrozen(d) && d === TW.safeAreaInset && Object.keys(d).sort().join() === SIDES.slice().sort().join()
    && SIDES.every(function (k) { return typeof d[k] === 'number' && isFinite(d[k]); }), d ? JSON.stringify(d) : 'no SDK', S);
  T.ok('tw.safe-area', "the device's edges: finite numbers ≥ 0 (a page has no ranges)", SIDES.every(function (k) { return isFinite(D[k]) && D[k] >= 0; }), JSON.stringify(D));
  T.ok('tw.safe-area', 'safeAreaChanged is an event a widget may listen to', function () { try { var f = function () {}; TW.onEvent('safeAreaChanged', f); TW.offEvent('safeAreaChanged', f); return true; } catch (e) { return [false, String(e)]; } }, '', S);
  T.ok('tw.content-safe-area', "the client's chrome: finite numbers ≥ 0 on every side, the corners 0", SIDES.every(function (k) { return isFinite(C[k]) && C[k] >= 0; })
    && C.cornerLeft === 0 && C.cornerRight === 0, JSON.stringify(C));
  T.eq('tw.safe-area', 'the root variables are its values', SIDES.map(function (n) { return v('--tg-safe-area-inset-' + n); }).join(), SIDES.map(function (n) { return D[n] + 'px'; }).join(), S);
  T.eq('tw.content-safe-area', 'the root variables are its values, the corners 0', ['inset-top', 'inset-right', 'inset-bottom', 'inset-left', 'corner-left', 'corner-right'].map(function (n) { return v('--tg-content-safe-area-' + n); }).join(),
    [C.top, C.right, C.bottom, C.left, 0, 0].map(function (n) { return n + 'px'; }).join(), S);

  // Bare: the renderer's UA layer pads an unstyled body by the sum on every side.
  var b = getComputedStyle(document.body);
  T.eq('tw.safe-area', 'body: the sum of both layers as padding on all four sides (the UA layer)', SIDES.map(function (k) { return Math.round(parseFloat(b['padding' + k[0].toUpperCase() + k.slice(1)])); }).join(), SIDES.map(function (k) { return Math.round(sum(k)); }).join());
  T.near('css.value.env', 'env(safe-area-inset-top) is the device top plus the header', W('#e1'), sum('top'), 0.5);
  T.near('css.value.env', 'env(safe-area-inset-bottom, 77px) is the sum, not the fallback', W('#e2'), sum('bottom'), 0.5);
  T.near('css.value.env', 'env(safe-area-inset-left, 5px) is the sum on the left, not the fallback', W('#e3'), sum('left'), 0.5);
  T.near('css.value.env', 'calc(10px + env(safe-area-inset-top, 0)): a unitless 0 fallback', W('#e4'), 10 + sum('top'), 0.5);
  T.near('css.value.env', 'max(4px, env(safe-area-inset-right))', W('#e5'), Math.max(4, sum('right')), 0.5);
  T.near('css.value.env', 'var(--tg-safe-area-inset-top) is the device top alone', W('#e6'), D.top, 0.5);
  T.near('css.value.env', 'var(--tg-safe-area-inset-bottom) is the device bottom alone', W('#e7'), D.bottom, 0.5);
  T.near('css.value.env', 'var(--tg-content-safe-area-inset-top) is the header alone', W('#e8'), C.top, 0.5);
});
T.run();
</script>
</body>
