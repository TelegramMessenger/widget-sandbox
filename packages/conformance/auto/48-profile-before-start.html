<body>
<div class="conf-head">48 · Profile: before Start</div>
<div class="conf-probes"><button id="ask" style="width:160px;height:36px">Ask (a tap)</button></div>
<div id="conf-list"></div>
<script>
// Before Start (docs/sdk-v1.md §2.19): no flags from the server, so nothing that needs canQuery, and no chat on a page.
var TW = typeof TelegramWidget !== 'undefined' ? TelegramWidget : null;
var S = T.sandbox ? {} : { sandboxOnly: true };
// Natively there is no SDK: every check is recorded as sandbox only.
var W = TW || {};
T.step(function () {
  T.eq('tw.surface', "surface is 'profile'", W.surface, 'profile', S);
  T.ok('behaviour.profile-start', 'chatType is null (a profile page has no chat)', W.chatType === null, String(W.chatType), S);
  T.ok('tw.context', 'isForward and isPreview are false', W.isForward === false && W.isPreview === false, W.isForward + ' / ' + W.isPreview, S);
  T.ok('tw.context', 'viewer is null (no canQuery before Start)', W.viewer === null, JSON.stringify(W.viewer), S);
  T.ok('behaviour.profile-start', 'wallet is null (no canQuery before Start)', W.wallet === null, String(W.wallet), S);
});
// Without a tap: NOT_ALLOWED at once (never in the background before Start). It runs after the tap's request has settled.
var bg = T.wait('tw.request', 'a request without a tap is refused with NOT_ALLOWED', S);
function background() {
  var p;
  try { p = TW && TW.request('conf:a48:bg'); } catch (e) { return bg.fail('threw ' + e); }
  if (!p) return bg.fail('no request');
  p.then(function () { bg.fail('resolved'); }, function (e) { bg.result(e.code === 'NOT_ALLOWED', e.code); });
}
// A tap: NOT_ALLOWED too, no canQuery before Start.
var tap = T.wait('tw.request', 'a request on a tap is refused with NOT_ALLOWED too', S);
document.getElementById('ask').onclick = function () {
  var p;
  try { p = TW.request('conf:a48:tap'); } catch (x) { return tap.fail('threw ' + x); }
  p.then(function () { tap.fail('resolved'); }, function (x) { tap.result(x.code === 'NOT_ALLOWED', x.code); })
    .then(function () { setTimeout(background, 0); });
};
T.target('ask', '#ask');
T.run({ awaitInput: 20000 });
</script>
</body>
