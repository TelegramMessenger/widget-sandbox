<!-- conformance:harness --><style>html,body{margin:0;padding:0}body{font:13px/1.35 system-ui,sans-serif;color:#111;background:transparent}@media (prefers-color-scheme:dark){body{color:#e8e8e8}}[data-stage]{position:relative;overflow:hidden;background:#fff;box-sizing:border-box}.conf-stages{position:relative}.conf-stages>[data-stage]{position:absolute}.conf-head{height:18px;margin:6px 8px 2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#conf-summary{font-weight:400;margin-left:6px}#conf-summary.good{color:#1a7f37}#conf-summary.bad{color:#c62828}#conf-list{margin:2px 8px 8px;white-space:pre-wrap;font:11px/1.35 ui-monospace,monospace;overflow-wrap:anywhere}.conf-probes{margin:0 8px}.v-head{margin:8px 10px 2px;font-weight:600;font-size:15px}.v-hint{margin:0 10px 6px;font-size:12px}.v-row{display:flex;flex-wrap:wrap;align-items:flex-start;margin:6px 10px 10px}.v-row>[data-stage]{margin-right:8px}.v-ref{display:block;background:#fff}.v-cap{width:100%;margin-top:3px;font-size:12px}.v-tag{font-size:10px;font-weight:600;margin-right:4px;padding:0 4px;border-radius:3px;background:#8884}[data-stage="no-selection"]{left:8px;top:8px;width:80px;height:60px}.conf-stages{height:76px}</style><script>var T = (function () {

  function fmt(v) {

  function record(id, name, ok, detail, opts) {

      skip: function (d) { if (!h.done) { h.done = true; record(id, name, null, d, opts); maybeFinish(); } },

    if (typeof el === 'string') el = document.querySelector(el);
    var r = el.getBoundingClientRect();

    return getComputedStyle(el, pseudo || null).getPropertyValue(prop).trim();

  /** Normalised computed colour "r,g,b,a" (a 0–1, two decimals) from rgb()/rgba(). */
  function color(el, prop, pseudo) {

    var m = /rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:\s*[,/]\s*([\d.]+%?))?\s*\)/.exec(v);

    var out = { v: 1, id: ID, mode: mode, status: st, n: n, checks: checks.map(function (c) { return [c.id, c.name, c.status, c.detail]; }) };

    if (targetRects && st !== 'done') { try { measureTargets(); } catch (e) {} }

    if (stageRects) out.stages = stageRects;
    root.setAttribute('data-conformance', JSON.stringify(out));
    var p = document.getElementById('conf-summary');
    if (p) {
      p.textContent = (st === 'done' ? '' : st + ' · ') + 'pass ' + n.pass + ' · fail ' + n.fail + (n.xfail ? ' · xfail ' + n.xfail : '') + (n.xpass ? ' · XPASS ' + n.xpass : '') + (n.skip ? ' · skip ' + n.skip : '') + (n.pending ? ' · pending ' + n.pending : '');
      p.className = n.fail || n.xpass ? 'bad' : n.pending ? '' : 'good';
    }
    var list = document.getElementById('conf-list');
    if (list) {
      var lines = [];
      for (var i = 0; i < checks.length; i++) {
        var c = checks[i];
        if (list.hasAttribute('data-all') || c.status === 'fail' || c.status === 'xpass' || c.status === 'pending')
          lines.push({ 'pass': '✓ ', 'fail': '✗ ', 'xfail': '· ', 'xpass': '! ', 'skip': '– ', 'pending': '… ' }[c.status] + c.id + ' — ' + c.name + (c.detail && c.status !== 'pass' ? ' (' + c.detail + ')' : ''));
      }
      list.textContent = lines.join('\n');
    }
    if (st === 'done' && typeof console !== 'undefined') console.log('[conformance] ' + ID + ' ' + JSON.stringify(n));
  }
  function schedulePublish() { if (!panelTimer) panelTimer = setTimeout(publish, 0); }

  function maybeFinish() {
    if (!started || queue.length) return;
    var n = counts();
    if (n.pending === 0) { finished = true; publish(); }
    else schedulePublish();
  }

  /** Mark the remaining pending checks failed (no event arrived) and finish. */
  function timeout() {
    for (var i = 0; i < checks.length; i++) if (checks[i].status === 'pending') { checks[i].status = 'fail'; checks[i].detail = (checks[i].detail ? checks[i].detail + '; ' : '') + 'timed out'; }
    finished = true;
    publish();
  }

  /** Steps run in order after the first frames; a step may return a delay in ms before the next one. */
  function step(fn) { queue.push(fn); }
  function r4(el) { var r = el.getBoundingClientRect(); return [Math.round(r.left * 10) / 10, Math.round(r.top * 10) / 10, Math.round(r.width * 10) / 10, Math.round(r.height * 10) / 10]; }
  function measureTargets() {

  }

    if (opts.awaitInput) { awaiting = true; deadline = opts.awaitInput; }
    else if (opts.deadline) deadline = opts.deadline;

<div class="conf-stages">

<div class="conf-head">17 · Drag, hover, hit testing <span id="conf-summary"></span></div>
<div class="conf-probes">
  <span id="hov">hover</span>
  <div id="track"><div id="knob"></div></div>
  <div id="hit"><button id="under">under</button><div id="overlay"></div></div>

</div>

<script>
['hov', 'knob', 'overlay', 'finish', 'sel-from', 'sel-to'].forEach(function (n) { T.target(n, '#' + n); });
var hoverPointer = typeof matchMedia === 'function' && matchMedia('(hover: hover)').matches;
var hovEv = T.wait('input.hover-events', 'pointerenter, pointerover, mouseenter reach the widget', hoverPointer ? {} : { sandboxOnly: true });
var hovCss = T.wait('sel.hover', ':hover applies under a pointer');
var drag = T.wait('input.drag', 'pointerdown → pointermove (buttons=1) → pointerup moves the knob');
var cap = T.wait('input.drag', 'setPointerCapture keeps moves coming past the element');
var mv = T.wait('input.drag', 'movementX adds up to the distance');
var pe = T.wait('css.pointer-events', 'a tap through a pointer-events: none overlay hits the button below');
var touch = T.wait('input.touch-events', 'no touch events reach the widget on a touch client: pointer events only (profile 1: out)', { xfail: 'the renderer still forwards touch events' });
var seen = {};
var hov = document.getElementById('hov');
['pointerenter', 'pointerover', 'mouseenter'].forEach(function (t) { hov.addEventListener(t, function () { seen[t] = 1; if (seen.pointerenter && seen.pointerover && seen.mouseenter) hovEv.pass(); }); });
var hoverChecked = false;
hov.addEventListener('pointerover', function () { if (hoverChecked) return; hoverChecked = true; setTimeout(function () { var c = T.color(hov); if (hoverPointer || T.mode !== 'sandbox') hovCss.result(c === '0,160,0,1', c); else hovCss.skip('touch client: no hover'); }, 150); });

var knob = document.getElementById('knob'), track = document.getElementById('track');

knob.addEventListener('pointerdown', function (e) {
  start = e.clientX; x0 = parseFloat(knob.style.left) || 0; moves = 0; outside = 0; movement = 0;
  try { knob.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();

knob.addEventListener('pointermove', function (e) {
  if (start === null || !(e.buttons & 1)) return;
  moves++; movement += e.movementX || 0;
  var tr = track.getBoundingClientRect();
  if (e.clientX > tr.right) outside++;
  knob.style.left = Math.max(0, Math.min(172, x0 + e.clientX - start)) + 'px';
});
knob.addEventListener('pointerup', function (e) {
  if (start === null) return;
  drags++;
  var dx = e.clientX - start;
  start = null;
  if (drags === 1) {
    drag.result(moves >= 3 && Math.abs(T.rect('#knob').x - T.rect('#track').x - Math.min(172, dx)) < 2, moves + ' moves, knob at ' + Math.round(T.rect('#knob').x - T.rect('#track').x) + ', dx ' + dx);
    mv.result(Math.abs(movement - dx) <= 3, 'movementX ' + movement + ' vs ' + dx);
