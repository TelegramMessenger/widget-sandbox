name: TwidgetDemoMac
options:
  bundleIdPrefix: org.telegram.widgetsandbox
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "26.0"
packages:
  WidgetSandbox:
    path: ../../..   # the repo root holds Package.swift (packages/ios)
targets:
  TwidgetDemoMac:
    type: application
    platform: macOS
    # The SwiftUI sources and the corpus are the iOS demo's; the few platform
    # differences are `#if os(macOS)` branches in DemoPlatform.swift.
    sources:
      - path: ../../ios/DemoApp/Sources
      - path: ../../ios/DemoApp/Corpus
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Build the Blitz renderer (cargo)
        script: "\"$SRCROOT/../../renderer-blitz/build-apple.sh\""
        basedOnDependencyAnalysis: false
      - name: Build the litehtml renderer (cmake)
        script: "\"$SRCROOT/../../renderer-litehtml/build-apple.sh\""
        basedOnDependencyAnalysis: false
    dependencies:
      - package: WidgetSandbox
    info:
      path: Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        SWIFT_VERSION: "5.0"
        # Native renderer prototypes (dev tooling): the Rust static library from
        # renderer-blitz/ and the C++ one from renderer-litehtml/ (both built by
        # the pre-build script phases) and their C headers.
        SWIFT_OBJC_BRIDGING_HEADER: ../../ios/DemoApp/BridgingHeader.h
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../../renderer-blitz/target/apple/$(PLATFORM_NAME)", "$(SRCROOT)/../../renderer-litehtml/target/apple/$(PLATFORM_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-ltwidget_blitz", "-ltwidget_litehtml", "-lc++", "-framework", "CoreText", "-framework", "CoreGraphics", "-framework", "ImageIO", "-liconv"]
        PRODUCT_BUNDLE_IDENTIFIER: org.telegram.widgetsandbox.TwidgetDemoMac
        # Dev tool, never distributed: ad-hoc signature, no team, no sandbox
        # (the attack runner must reach the canary on 127.0.0.1:9999 itself).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
