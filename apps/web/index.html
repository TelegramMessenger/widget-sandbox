<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>widget-sandbox — dev app</title>
</head>
<body>
  <div id="app">
    <aside id="left">
      <h2>Corpus</h2>
      <div id="drop" tabindex="0">Drop any .html file here<br><small>(or click to pick)</small><input type="file" id="file" accept=".html,.htm,text/html" hidden></div>
      <ul id="corpus"></ul>
    </aside>
    <main id="center">
      <div class="toolbar">
        <span id="title">no widget loaded</span>
        <span class="spacer"></span>
        <label class="single-only" title="the bubble's width: what a client lays the widget out at (the reference and compare columns follow); free: drag the column's corner"><select id="width"></select> <span id="width-value" class="muted"></span></label>
        <label title="who gets a press (docs/sdk-v1.md §5.5): the bubble of a phone client or of a desktop client, unless touch-action claims it; off: the widget gets everything (no client does that)">gestures <select id="gesture-mode"></select></label>
        <label class="single-only" title="where the widget is shown (docs/sdk-v1.md §2.19): a bubble in a chat, or the bot's profile page full screen (a phone at 390 × 844 with the status bar, the native header, the Start button and the home indicator over it); the phase before and after Start is the Bot panel's message kind">place <select id="surface"><option value="message">bubble</option><option value="profile">profile page</option></select></label>
        <label class="single-only" title="the message time (docs/sdk-v1.md §2.17): in the caption's line (nothing over the widget), or over the widget's bottom corner as on a photo, right (a left-to-right client) or left (right-to-left); the widget gets the band and the corner as env(safe-area-inset-bottom), --tg-content-safe-area-* and TelegramWidget.contentSafeAreaInset">time <select id="time-corner"></select></label>
        <label><input type="checkbox" id="dark"> dark</label>
        <label class="single-only"><input type="checkbox" id="reference"> reference mode</label>
        <label class="single-only" title="Blitz renderer (wasm) instead of the iframe — dev tooling, needs pnpm build:blitz-web"><input type="checkbox" id="blitz"> Blitz</label>
        <label class="single-only" title="litehtml renderer (wasm) instead of the iframe — dev tooling, needs pnpm build:litehtml-web"><input type="checkbox" id="litehtml"> litehtml</label>
        <label class="single-only" title="Shadow DOM renderer instead of the iframe — the same renderer core on a shadow root in this page (prototype)"><input type="checkbox" id="shadow"> shadow</label>
        <label class="single-only" title="every renderer side by side — iframe, Blitz, litehtml and the native reference — dev tooling"><input type="checkbox" id="compare"> compare all</label>
        <label title="chat feed demo: 60–80 bubbles on corpus/common with the list's own lifecycle, a warmed worker pool, a live renderer switch and one hostile bubble — dev tooling (src/feed.ts)"><input type="checkbox" id="feed"> feed</label>
        <button id="reload" class="single-only" type="button" title="re-create the sandbox from the same HTML">restart</button>
      </div>
      <!-- feed mode (?feed=1): src/feed.ts builds the chat feed, its controls and the metrics overlay here -->
      <div id="feed-view" class="hidden"></div>
      <div class="stage">
        <div class="chat" id="chat-sandbox">
          <!-- the network marker (docs/integration.md "The network marker"): shown when the message has can_query -->
          <div class="bubble-head">sandbox <span id="net-marker" class="net-marker hidden" title="can_query: a tap on this widget may send data to the bot's server (docs/integration.md, the network marker)">⇅ may send data to the bot</span></div>
          <div class="bubble"><div class="frame-wrap" id="sandbox-wrap"></div><div id="time-corner-view" class="hidden"></div>
            <!-- profile mode (?surface=profile, a profile message kind): the client's chrome over the bot's profile page, drawn
                 outside the widget at the reference page's numbers (REFERENCE_PROFILE): the status bar and the native header
                 over the top, the Start / Open App button and the home indicator over the bottom -->
            <div id="profile-chrome" class="profile-chrome hidden">
              <div class="profile-status"><span>9:41</span><span>●●● ▮</span></div>
              <div class="profile-header"><span class="profile-back">‹</span><span class="profile-avatar"></span><span class="profile-name"></span></div>
              <div class="profile-bottom"><button id="profile-start" type="button" title="the bot's Start button (docs/sdk-v1.md §2.19): the client re-creates the widget as the private chat's, its storage kept">Start</button></div>
              <div class="profile-home"><span></span></div>
            </div>
          </div>
          <div id="widget-error" class="hidden"></div>
        </div>
        <!-- compare mode: one more column per renderer the main bubble is not using (main.ts fills it) -->
        <div id="compare-chats" class="compare-chats"></div>
        <div class="chat hidden" id="chat-reference">
          <div class="bubble-head">reference — native, dev tooling only</div>
          <div class="bubble"><div class="frame-wrap" id="reference-wrap"></div><div id="time-corner-ref" class="hidden"></div></div>
        </div>
      </div>
    </main>
    <aside id="right">
      <section><h3>Status</h3><div id="status">—</div></section>
      <section><h3>Stats</h3><table id="stats"></table></section>
      <section><h3>Diagnostics</h3><ul id="diags"></ul></section>
      <section><h3>Bridge</h3><ul id="bridge"></ul></section>
      <section title="the mock bot (src/mock-bot.ts): the widget's chatData / publicData, the bot's edits, its answers to requests, and the context a client passes"><h3>Bot (mock)</h3><div id="bot-panel"></div></section>
      <section><h3>Gestures</h3><ul id="gestures"></ul></section>
      <section class="grow"><h3>Widget console</h3><pre id="console"></pre></section>
    </aside>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
