<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>widget-sandbox — dev app</title>
</head>
<body>
  <div id="app">
    <aside id="left">
      <h2>Corpus</h2>
      <div id="drop" tabindex="0">Drop any .html file here<br><small>(or click to pick)</small><input type="file" id="file" accept=".html,.htm,text/html" hidden></div>
      <ul id="corpus"></ul>
    </aside>
    <main id="center">
      <div class="toolbar">
        <span id="title">no widget loaded</span>
        <span class="spacer"></span>
        <label><input type="checkbox" id="dark"> dark</label>
        <label class="single-only"><input type="checkbox" id="reference"> reference mode</label>
        <label class="single-only" title="Blitz renderer (wasm) instead of the iframe — dev tooling, needs pnpm build:blitz-web"><input type="checkbox" id="blitz"> Blitz</label>
        <label class="single-only" title="litehtml renderer (wasm) instead of the iframe — dev tooling, needs pnpm build:litehtml-web"><input type="checkbox" id="litehtml"> litehtml</label>
        <label class="single-only" title="Shadow DOM renderer instead of the iframe — the same renderer core on a shadow root in this page (prototype)"><input type="checkbox" id="shadow"> shadow</label>
        <label class="single-only" title="every renderer side by side — iframe, Blitz, litehtml and the native reference — dev tooling"><input type="checkbox" id="compare"> compare all</label>
        <label title="chat feed demo: 60–80 bubbles on corpus/common with the list's own lifecycle, a warmed worker pool, a live renderer switch and one hostile bubble — dev tooling (src/feed.ts)"><input type="checkbox" id="feed"> feed</label>
        <button id="reload" class="single-only" type="button" title="re-create the sandbox from the same HTML">restart</button>
      </div>
      <!-- feed mode (?feed=1): src/feed.ts builds the chat feed, its controls and the metrics overlay here -->
      <div id="feed-view" class="hidden"></div>
      <div class="stage">
        <div class="chat" id="chat-sandbox">
          <div class="bubble-head">sandbox</div>
          <div class="bubble"><div class="frame-wrap" id="sandbox-wrap"></div></div>
          <div id="widget-error" class="hidden"></div>
        </div>
        <!-- compare mode: one more column per renderer the main bubble is not using (main.ts fills it) -->
        <div id="compare-chats" class="compare-chats"></div>
        <div class="chat hidden" id="chat-reference">
          <div class="bubble-head">reference — native, dev tooling only</div>
          <div class="bubble"><div class="frame-wrap" id="reference-wrap"></div></div>
        </div>
      </div>
    </main>
    <aside id="right">
      <section><h3>Status</h3><div id="status">—</div></section>
      <section><h3>Stats</h3><table id="stats"></table></section>
      <section><h3>Diagnostics</h3><ul id="diags"></ul></section>
      <section><h3>Bridge</h3><ul id="bridge"></ul></section>
      <section class="grow"><h3>Widget console</h3><pre id="console"></pre></section>
    </aside>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
